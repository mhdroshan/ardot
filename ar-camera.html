<!DOCTYPE html>
<html>
<head>
    <title>Instant AR Camera</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- 
      arjs attributes:
      - sourceType: webcam (uses the phone camera)
      - debugUIEnabled: false (hides debug info)
      - detectionMode: mono_and_matrix (standard)
    -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
        
        <!-- 
          Lighting 
        -->
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1.5" position="-1 1 0"></a-light>

        <!-- 
          The 3D Model 
          Position: 0 0 -3 (3 meters in front of the camera)
          Scale: Adjusted for visibility (placeholder is big)
        -->
        <a-entity 
            gltf-model="url(assets/models/3d1.glb)" 
            position="0 0 -5" 
            scale="0.5 0.5 0.5"
            rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>

        <!-- Camera -->
        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
