<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Viewer</title>
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f0f0f0; }
        
        /* Custom AR Button Style */
        #ar-button {
            background-image: url(https://modelviewer.dev/shared-assets/icons/ic_view_in_ar_new_googblue_48dp.png);
            background-repeat: no-repeat;
            background-size: 32px 32px;
            background-position: 16px 50%;
            background-color: #fff;
            position: absolute;
            left: 50%;
            bottom: 50px; /* Moved up slightly */
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 0px 24px 0px 56px; /* More padding */
            font-family: Roboto, Regular, Helvetica, Neue, sans-serif;
            font-size: 16px; /* Larger font */
            font-weight: bold;
            color:#4285f4;
            height: 48px; /* Taller button */
            line-height: 48px;
            border-radius: 24px;
            border: 1px solid #DADCE0;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s ease-in-out;
        }

        #ar-button:active {
            background-color: #E8EAED;
            transform: translateX(-50%) scale(0.95);
        }

        /* Instructions Overlay */
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none; /* Let clicks pass through */
            z-index: 99;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <!-- 
        Note: Replace 'src' and 'poster' with your actual model and image paths.
        For iOS AR Quick Look, a .usdz file is often preferred for 'ios-src', 
        but .glb may work on newer devices.
    -->
    <model-viewer
        src="assets/models/3d1.glb"
        alt="A 3D model of a building"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="45deg 55deg 2.5m"
        field-of-view="30deg">
        
        <div id="instructions">Point camera at floor or flat surface after tapping</div>
        
        <button slot="ar-button" id="ar-button">
            Tap to View in AR
        </button>
        
        <div id="ar-prompt">
            <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
        </div>
    </model-viewer>
</body>
</html>
