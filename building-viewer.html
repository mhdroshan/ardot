<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Viewer</title>
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f0f0f0; }
        
        /* Custom AR Button Style */
        #ar-button {
            background-image: url(https://modelviewer.dev/shared-assets/icons/ic_view_in_ar_new_googblue_48dp.png);
            background-repeat: no-repeat;
            background-size: 20px 20px;
            background-position: 12px 50%;
            background-color: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            bottom: 30px;
            padding: 0px 16px 0px 40px;
            font-family: Roboto, Regular, Helvetica, Neue, sans-serif;
            font-size: 14px;
            color:#4285f4;
            height: 36px;
            line-height: 36px;
            border-radius: 18px;
            border: 1px solid #DADCE0;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 100;
        }
        
        #ar-button:active {
            background-color: #E8EAED;
        }
        
        #ar-button:focus {
            outline: none;
        }
        
        #ar-button:focus-visible {
            outline: 1px solid #4285f4;
        }

        /* AR Prompt Animation */
        @keyframes circle {
            from { transform: translateX(-50%) rotate(0deg) translateX(50px) rotate(0deg); }
            to   { transform: translateX(-50%) rotate(360deg) translateX(50px) rotate(-360deg); }
        }
        @keyframes elong {
            from { transform: translateX(100px); }
            to   { transform: translateX(-100px); }
        }
        model-viewer > #ar-prompt {
            position: absolute;
            left: 50%;
            bottom: 175px;
            animation: elong 2s infinite ease-in-out alternate;
            display: none;
        }
        model-viewer[ar-status="session-started"] > #ar-prompt {
            display: block;
        }
        model-viewer > #ar-prompt > img {
            animation: circle 4s linear infinite;
        }
        
        /* Loading Poster */
        .lazy-load-poster {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background-image: url("https://modelviewer.dev/shared-assets/models/Astronaut.png"); /* Optional: Placeholder image */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        #button-load {
            background-image: url("https://www.astronomy.com/wp-content/uploads/2023/02/Aldrin_Apollo_11.jpg");
            background-repeat: no-repeat;
            background-size: 24px 24px;
            background-position: 6% 50%;
            background-color: #000;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            display: inline-block;
            padding: 10px 18px 9px 40px;
            font-weight: 500;
            box-shadow: 0 0 8px rgba(0,0,0,.2), 0 0 4px rgba(0,0,0,.25);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate3d(-50%, -50%, 0);
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- 
        Note: Replace 'src' and 'poster' with your actual model and image paths.
        For iOS AR Quick Look, a .usdz file is often preferred for 'ios-src', 
        but .glb may work on newer devices.
    -->
    <model-viewer
        src="assets/models/3d1.glb"
        alt="A 3D model of a building"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="45deg 55deg 2.5m"
        field-of-view="30deg">
        
        <button slot="ar-button" id="ar-button">
            View in your space
        </button>
        
        <div id="ar-prompt">
            <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
        </div>
    </model-viewer>
</body>
</html>
